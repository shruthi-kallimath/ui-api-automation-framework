name: Android Appium Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r qa-ui-api-framework/requirements.txt

      - name: Install Appium and Android driver
        run: |
          npm install -g appium@3.8.0
          appium driver install uiautomator2@8.7.0

      - name: Download demo APK
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/saucelabs/my-demo-app-rn/releases/download/v1.3.0/Android-MyDemoAppRN.1.3.0.build-244.apk" \
            --output demo.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start emulator and run mobile tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          emulator-port: 5554
          disable-animations: true
          script: |
            adb -s emulator-5554 install -r demo.apk
            appium --address 127.0.0.1 --port 4723 > appium.log 2>&1 &
            python -c "import time, requests; ready=False; exec('for _ in range(60):\n try:\n  ready=requests.get(\"http://127.0.0.1:4723/status\", timeout=2).json()[\"value\"][\"ready\"]\n except requests.RequestException:\n  pass\n if ready:\n  break\n time.sleep(1)'); assert ready, 'Appium did not become ready'"
            cd qa-ui-api-framework && python -m pytest tests/mobile/test_mobile_login.py -v -p no:cacheprovider --alluredir=allure-results-mobile --junitxml=mobile-results.xml

      - name: Upload mobile results and Appium log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-test-results
          path: |
            qa-ui-api-framework/allure-results-mobile/
            qa-ui-api-framework/mobile-results.xml
            appium.log
          retention-days: 7